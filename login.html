<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ================= HEADER ================= -->
<header>
    <h1>CraftVerse</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span class="cart-count-badge" style="display:none;">0</span></a>
        <a href="contact.html">Contact</a>
        <span id="nav-auth-links">
            <a href="login.html" class="active">Login</a>
        </span>
    </nav>
</header>

<main>
    <section class="login-section" style="max-width: 480px; margin: 40px auto;">
        <h2>Customer Login</h2>
        <p class="login-intro">
            Login to your CraftVerse account to track orders and shop handcrafted products.
        </p>

        <form class="login-form" id="loginForm" onsubmit="handleCustomerLogin(event)">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="Enter your registered email"
                    required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>
            <div class="forgot-password" style="text-align: right; margin-bottom: 15px;">
                <a href="#" onclick="handleForgotPassword(event)">
                    Forgot Password?
                </a>
            </div>
            <button type="submit" class="btn" style="width: 100%;">
                Login Now 🚀
            </button>
        </form>

        <p class="register-link" style="margin-top: 25px;">
            Don't have an account yet?
            <a href="register.html"><strong>Register Here</strong></a>
        </p>
        <p class="guest-link">
            Want to explore first?
            <a href="index.html">Continue as Guest</a>
        </p>
    </section>
</main>

<footer>
    <p>© 2026 CraftVerse. All Rights Reserved.</p>
</footer>

<!-- Toast Notification -->
<div id="toast-notification" class="toast-notification"></div>

<script src="js/main.js"></script>
<script>
    async function handleForgotPassword(event) {
        event.preventDefault();
        const email = prompt("Enter the email address for your account:");
        if (!email) return;
        try {
            const response = await fetch("/api/password-reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email.trim().toLowerCase() })
            });
            const data = await response.json();
            showToast(data.message || (response.ok ? "Check your email for next steps." : "Could not request a password reset."));
        } catch (error) {
            console.error("Password reset request failed:", error);
            showToast("Unable to connect to the server. Please try again later.");
        }
    }

    async function handleCustomerLogin(e) {
    e.preventDefault();

    const email = document.getElementById("login-email").value.trim().toLowerCase();
    const password = document.getElementById("login-password").value;

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.status === 401) {
            showToast("Invalid email or password. Please try again.");
            return;
        }

        if (!response.ok || !data.success) {
            const message = data.message || "Please try again later.";
            showToast(response.status >= 500 ? `Server/database error: ${message}` : message);
            return;
        }

        if (data.user) {
            const role = String(data.user.role || "customer").trim().toLowerCase();
            data.user.role = role;
            localStorage.setItem("craftverse_user", JSON.stringify(data.user));

            if (role === "admin") {
                localStorage.setItem("craftverse_admin_logged", "true");
            } else {
                localStorage.removeItem("craftverse_admin_logged");
            }

            showToast(`Welcome back, ${data.user.name}! 🎉`);

            setTimeout(() => {
                if (role === "admin") {
                    window.location.href = "admin.html";
                    return;
                }
                if (role === "seller") {
                    window.location.href = "seller.html";
                    return;
                }

                const cart = getCart();

                if (cart.length > 0) {
                    window.location.href = "checkout.html";
                } else {
                    window.location.href = "index.html";
                }
            }, 1000);
        } else {
            showToast("Login failed: user information was not returned by the server.");
        }

    } catch (error) {
        console.error("Login Error:", error);
        showToast("❌ Unable to connect to server!");
    }
}
</script>
</body>
</html>
