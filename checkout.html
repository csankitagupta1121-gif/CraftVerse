<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ================= HEADER ================= -->
    <header>
        <h1>CraftVerse</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart <span class="cart-count-badge" style="display:none;">0</span></a>
            <a href="contact.html">Contact</a>
            <span id="nav-auth-links">
                <a href="login.html">Login</a>
            </span>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main>
        <section class="checkout-section">
            <h2>Checkout</h2>
            <p class="section-intro">
                Complete your delivery details to confirm and place your order.
            </p>

            <div class="checkout-container">
                <!-- DELIVERY FORM -->
                <div class="checkout-details">
                    <h3>Delivery Information</h3>
                    <form class="checkout-form" id="checkoutForm" onsubmit="handlePlaceOrder(event)">
                        <div class="form-group">
                            <label for="checkout-name">Full Name</label>
                            <input type="text" id="checkout-name" name="name" placeholder="Enter your full name"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-phone">Mobile Number</label>
                            <input type="tel" id="checkout-phone" name="phone" placeholder="10-digit mobile number"
                                pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-address">Delivery Address</label>
                            <textarea id="checkout-address" name="address"
                                placeholder="Flat/House No., Street, Area, Landmark" rows="4" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="checkout-city">City</label>
                            <input type="text" id="checkout-city" name="city" placeholder="e.g. Mumbai" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-state">State</label>
                            <input type="text" id="checkout-state" name="state" placeholder="e.g. Maharashtra" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-pincode">Pincode</label>
                            <input type="text" id="checkout-pincode" name="pincode" placeholder="6-digit pincode"
                                pattern="[0-9]{6}" required>
                        </div>

                        <!-- PAYMENT SELECTION -->
                        <h3 style="margin-top: 25px;">Payment Method</h3>
                        <div class="payment-options"
                            style="margin: 15px 0 25px; display: flex; flex-direction: column; gap: 10px;">
                            <label
                                style="display: flex; align-items: center; gap: 10px; cursor: pointer; background: #fff; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);">
                                <input type="radio" name="paymentMethod" value="Cash on Delivery (COD)" checked
                                    required>
                                <span>💵 <strong>Cash on Delivery (COD)</strong> (Pay at your doorstep)</span>
                            </label>
                            <label
                                style="display: flex; align-items: center; gap: 10px; cursor: pointer; background: #fff; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);">
                                <input type="radio" name="paymentMethod" value="Online Payment / UPI" required>
                                <span>📱 <strong>UPI / Net Banking / Card</strong> (Pay Online)</span>
                            </label>
                        </div>

                        <button type="submit" class="btn" id="placeOrderSubmitBtn"
                            style="width: 100%; font-size: 16px; padding: 12px;">
                            Confirm & Place Order 🛍️
                        </button>
                    </form>
                </div>

                <!-- ORDER SUMMARY (DYNAMIC) -->
                <div class="checkout-summary">
                    <h3>Order Summary</h3>
                    <div id="checkoutItemsList" style="margin-bottom: 15px;">
                        <!-- Cart items will be loaded here dynamically -->
                    </div>
                    <div class="summary-row" style="border-top: 1px dashed var(--border); padding-top: 12px;">
                        <span>Delivery Charges</span>
                        <span style="color: green; font-weight: bold;">FREE</span>
                    </div>
                    <div class="summary-total">
                        <span>Total Amount</span>
                        <strong id="checkoutTotalAmount">₹0</strong>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 CraftVerse. All Rights Reserved.</p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast-notification" class="toast-notification"></div>

    <script src="js/main.js"></script>
    <script>
        // Load Dynamic Cart Summary on Checkout Page
        function loadCheckoutSummary() {
            const cart = getCart();
            const itemsList = document.getElementById("checkoutItemsList");
            const totalAmountEl = document.getElementById("checkoutTotalAmount");
            const submitBtn = document.getElementById("placeOrderSubmitBtn");

            if (cart.length === 0) {
                itemsList.innerHTML = `
                <p style="color: #a33; text-align: center; padding: 20px 0;">
                    Your cart is empty! Please add products before checking out.
                </p>
            `;
                totalAmountEl.textContent = "₹0";
                if (submitBtn) submitBtn.disabled = true;
                return;
            }

            let total = 0;
            itemsList.innerHTML = cart.map(item => {
                const itemQty = item.quantity || 1;
                const itemTotal = item.price * itemQty;
                total += itemTotal;

                return `
                <div class="summary-row" style="margin-bottom: 8px;">
                    <span>${item.name} (×${itemQty})</span>
                    <span>₹${itemTotal}</span>
                </div>
            `;
            }).join("");

            totalAmountEl.textContent = `₹${total}`;

            // Auto-fill customer info if logged in
            const user = JSON.parse(localStorage.getItem("craftverse_user"));
            if (user && user.name) {
                document.getElementById("checkout-name").value = user.name || "";
                if (user.phone) document.getElementById("checkout-phone").value = user.phone;
                if (user.address) document.getElementById("checkout-address").value = user.address;
            }
        }

        // Handle Order Submission
        function handlePlaceOrder(e) {
            e.preventDefault();
            const cart = getCart();

            if (cart.length === 0) {
                showToast("Your cart is empty! 🛒");
                return;
            }

            const name = document.getElementById("checkout-name").value.trim();
            const phone = document.getElementById("checkout-phone").value.trim();
            const address = document.getElementById("checkout-address").value.trim();
            const city = document.getElementById("checkout-city").value.trim();
            const state = document.getElementById("checkout-state").value.trim();
            const pincode = document.getElementById("checkout-pincode").value.trim();
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            if (paymentMethod === "Online Payment / UPI") {
                const paymentSuccess = confirm(
                    "Online Payment Demo\n\nClick OK to simulate successful payment."
                );

                if (!paymentSuccess) {
                    showToast("❌ Payment cancelled!");
                    return;
                }

                showToast("✅ Online Payment Successful!");
            }

            let totalAmount = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
            const orderId = `CV-${Math.floor(1000 + Math.random() * 9000)}`;
            const orderDate = new Date().toLocaleDateString("en-GB", { day: '2-digit', month: 'long', year: 'numeric' });

            const newOrder = {
                id: orderId,
                customer: name,
                phone: phone,
                address: `${address}, ${city}, ${state} - ${pincode}`,
                items: cart,
                total: totalAmount,
                paymentMethod: paymentMethod,
                orderDate: orderDate,
                status: "Placed"
            };

            // Save order in MySQL database
            const user = JSON.parse(localStorage.getItem("craftverse_user"));

            fetch("http://localhost:3000/api/orders", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    customer: name,
                    email: user ? user.email : "",
                    phone: phone,
                    address: `${address}, ${city}, ${state} - ${pincode}`,
                    totalAmount: totalAmount,
                    paymentMethod: paymentMethod,
                    status: "Placed",
                    orderDate: new Date().toISOString()
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        showToast("❌ Order could not be saved!");
                        return;
                    }

                    // Save order items in MySQL
                    fetch("http://localhost:3000/api/order-items", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            order_id: data.orderId,
                            items: cart
                        })
                    })
                        .then(itemResponse => itemResponse.json())
                        .then(itemData => {
                            if (!itemData.success) {
                                showToast("❌ Order saved, but items could not be saved!");
                                return;
                            }

                            saveCart([]);

                            showToast(`🎉 Order #${orderId} Placed Successfully!`);

                            setTimeout(() => {
                                window.location.href = "orders.html";
                            }, 1200);
                        })
                        .catch(error => {
                            console.error("Order Items Error:", error);
                            showToast("❌ Order items could not be saved!");
                        });
                })
                .catch(error => {
                    console.error("Order Error:", error);
                    showToast("❌ Unable to connect to server!");
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadCheckoutSummary();
        });
    </script>
</body>

</html>
