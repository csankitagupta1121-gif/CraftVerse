<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ================= HEADER ================= -->
    <header>
        <h1>CraftVerse</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart <span class="cart-count-badge" style="display:none;">0</span></a>
            <a href="contact.html">Contact</a>
            <span id="nav-auth-links">
                <a href="login.html">Login</a>
            </span>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main>
        <section class="register-section" style="max-width: 500px; margin: 40px auto;">
            <h2>Create Account</h2>
            <p class="register-intro">
                Create your CraftVerse account to start shopping authentic handmade crafts.
            </p>

            <!-- REGISTER FORM -->
            <form class="register-form" id="registerForm" onsubmit="handleCustomerRegister(event)">
                <!-- FULL NAME -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <!-- MOBILE NUMBER -->
                <div class="form-group">
                    <label for="phone">Mobile Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}"
                        title="Please enter a valid 10-digit mobile number" required>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                        placeholder="Create a strong password (min 6 characters)" minlength="6" required>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password"
                        placeholder="Re-enter your password" required>
                </div>

                <!-- REGISTER BUTTON -->
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">
                    Create Account ✨
                </button>
            </form>

            <!-- LOGIN LINK -->
            <p class="login-link" style="margin-top: 25px;">
                Already have an account?
                <a href="login.html"><strong>Login Here</strong></a>
            </p>
        </section>
    </main>

    <footer>
        <p>© 2026 CraftVerse. All Rights Reserved.</p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast-notification" class="toast-notification"></div>

    <script src="js/main.js"></script>
    <script>
        async function handleCustomerRegister(e) {
            e.preventDefault();

            const fullname = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            // Password matching validation
            if (password !== confirmPassword) {
                showToast("❌ Passwords do not match! Please check.");
                return;
            }

            try {
                const response = await fetch("http://localhost:3000/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: fullname,
                        email: email,
                        password: password,
                        phone: phone,
                        address: ""
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Auto-login newly registered user
                    localStorage.setItem("craftverse_user", JSON.stringify({
                        name: fullname,
                        email: email,
                        phone: phone,
                        address: ""
                    }));

                    showToast("🎉 Account created successfully! Welcome to CraftVerse.");

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1200);

                } else {
                    showToast(`❌ ${data.message}`);
                }

            } catch (error) {
                console.error("Registration Error:", error);
                showToast("❌ Unable to connect to server!");
            }
        }
    </script>
</body>

</html>
