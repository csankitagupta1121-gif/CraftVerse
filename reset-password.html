<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>CraftVerse</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="login.html">Login</a>
    </nav>
</header>
<main>
    <section class="login-section" style="max-width: 480px; margin: 40px auto;">
        <h2>Reset Password</h2>
        <p class="login-intro">Choose a new password for your CraftVerse account.</p>
        <form id="resetPasswordForm" onsubmit="submitPasswordReset(event)">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" minlength="6" maxlength="128" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" minlength="6" maxlength="128" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Save New Password</button>
        </form>
    </section>
</main>
<footer>
    <p>© 2026 CraftVerse. All Rights Reserved.</p>
</footer>
<div id="toast-notification" class="toast-notification"></div>
<script src="js/main.js"></script>
<script>
    async function submitPasswordReset(event) {
        event.preventDefault();
        const token = new URLSearchParams(window.location.search).get("token");
        const password = document.getElementById("new-password").value;
        const confirmation = document.getElementById("confirm-password").value;
        if (!token) {
            showToast("This reset link is invalid or incomplete.");
            return;
        }
        if (password !== confirmation) {
            showToast("The passwords do not match.");
            return;
        }
        try {
            const response = await fetch("/api/password-reset/confirm", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, password })
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                showToast(data.message || "Could not reset the password.");
                return;
            }
            showToast(data.message);
            document.getElementById("resetPasswordForm").reset();
            setTimeout(() => window.location.href = "login.html", 1200);
        } catch (error) {
            console.error("Password reset failed:", error);
            showToast("Unable to connect to the server. Please try again later.");
        }
    }
</script>
</body>
</html>
