<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ================= HEADER ================= -->
<header>
    <h1>CraftVerse</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span class="cart-count-badge" style="display:none;">0</span></a>
        <a href="contact.html">Contact</a>
        <span id="nav-auth-links">
            <a href="login.html">Login</a>
        </span>
    </nav>
</header>

<main>
    <section class="product-details-section">
        <div style="margin-bottom: 20px;">
            <a href="products.html" class="btn" style="padding: 8px 16px;">⬅ Back to Products</a>
        </div>

        <div class="product-details-container" id="productDetailsBox">
            <!-- PRODUCT IMAGE -->
            <div class="product-details-image">
                <img id="detailImg" src="images/bracelet.jpg" alt="Handmade Product" class="product-detail-img">
            </div>

            <!-- PRODUCT CONTENT & ACTIONS -->
            <div class="product-details-content">
                <h2 id="detailTitle" style="text-align: left; margin-bottom: 10px; color: var(--dark-brown);">Handmade Bracelet</h2>
                <p class="product-detail-price" id="detailPrice" style="font-size: 24px; font-weight: bold; color: var(--dark-brown); margin-bottom: 15px;">₹250</p>
                <p class="product-detail-description" id="detailDesc" style="margin-bottom: 20px; line-height: 1.7;">
                    Beautiful handcrafted bracelet perfect for daily wear and gifting.
                </p>
                
                <div class="product-info" style="margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
                    <p style="margin-bottom: 6px;"><strong>Category:</strong> <span id="detailCategory">Loading...</span></p>
                    <p style="margin: 0;"><strong>Availability:</strong> <span id="detailAvailability" style="font-weight: bold;">Loading...</span></p>
                </div>

                <div class="quantity-section" style="margin-bottom: 25px; display: flex; align-items: center; gap: 12px;">
                    <label for="detailQuantity" style="font-weight: bold;">Quantity:</label>
                    <input
                        type="number"
                        id="detailQuantity"
                        value="1"
                        min="1"
                        max="10"
                        style="width: 70px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 16px;">
                </div>

                <div class="product-actions" style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button type="button" class="btn" onclick="addCurrentProductToCart(false)">
                        Add to Cart 🛒
                    </button>
                    <button type="button" class="btn" onclick="addCurrentProductToCart(true)" style="background: var(--dark-brown); color: #fff;">
                        Buy Now ⚡
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 CraftVerse. All Rights Reserved.</p>
</footer>

<!-- Toast Notification -->
<div id="toast-notification" class="toast-notification"></div>

<script src="js/main.js"></script>
<script>
    let currentProduct = null;
    let currentProductId = null;
    let currentProductInStock = false;

    function showProductMessage(message) {
        const detailsBox = document.getElementById("productDetailsBox");
        const messageElement = document.createElement("p");
        messageElement.textContent = message;
        messageElement.style.cssText = "grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--muted);";
        detailsBox.replaceChildren(messageElement);
    }

    async function loadProductDetails() {
        const productId = new URLSearchParams(window.location.search).get("id");
        if (!productId || !productId.trim()) {
            showProductMessage("Product not found.");
            return;
        }

        currentProductId = productId;
        try {
            const response = await fetch(`/api/products/${encodeURIComponent(productId)}`);
            const data = await response.json();

            if (response.status === 404 || (!data.success && response.ok)) {
                showProductMessage("Product not found.");
                return;
            }
            if (!response.ok || !data.success || !data.product) {
                showProductMessage("Unable to load this product because of a server or database error.");
                return;
            }

            currentProduct = data.product;
            currentProductInStock = currentProduct.inStock === true || currentProduct.inStock === 1 || currentProduct.inStock === "1";

            const image = document.getElementById("detailImg");
            image.src = currentProduct.image || "images/bracelet.jpg";
            image.alt = currentProduct.name || "Handmade product";
            document.getElementById("detailTitle").textContent = currentProduct.name || "Unnamed product";
            document.getElementById("detailPrice").textContent = `₹${Number(currentProduct.price)}`;
            document.getElementById("detailDesc").textContent = currentProduct.description || "Authentic handmade artisanal craft.";
            document.getElementById("detailCategory").textContent = currentProduct.category || "Craft";

            const availability = document.getElementById("detailAvailability");
            availability.textContent = currentProductInStock ? "In Stock" : "Out of Stock";
            availability.style.color = currentProductInStock ? "green" : "#a33";

            document.querySelectorAll(".product-actions button").forEach(button => {
                button.disabled = !currentProductInStock;
            });
        } catch (error) {
            console.error("Product detail fetch error:", error);
            showProductMessage("Unable to connect to the server. Please try again later.");
        }
    }

    function addCurrentProductToCart(isBuyNow) {
        if (!currentProduct || !currentProductInStock) return;

        const qty = parseInt(document.getElementById("detailQuantity").value) || 1;
        let cart = getCart();
        const existingIndex = cart.findIndex(item => item.id === String(currentProductId));

        if (existingIndex > -1) {
            cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + qty;
        } else {
            cart.push({
                id: String(currentProductId),
                name: currentProduct.name,
                price: Number(currentProduct.price),
                image: currentProduct.image || "images/bracelet.jpg",
                quantity: qty
            });
        }

        saveCart(cart);

        if (isBuyNow) {
            window.location.href = "checkout.html";
        } else {
            showToast(`Added ${qty} × "${currentProduct.name}" to cart! 🛒`);
        }
    }

    loadProductDetails();
</script>
</body>
</html>
