<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ================= HEADER ================= -->
<header>
    <h1>CraftVerse</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span class="cart-count-badge" style="display:none;">0</span></a>
        <a href="contact.html">Contact</a>
        <span id="nav-auth-links">
            <a href="login.html">Login</a>
        </span>
        <a href="admin.html">Admin</a>
    </nav>
</header>

<main>
    <section class="product-details-section">
        <div style="margin-bottom: 20px;">
            <a href="products.html" class="btn" style="padding: 8px 16px;">⬅ Back to Products</a>
        </div>

        <div class="product-details-container" id="productDetailsBox">
            <!-- PRODUCT IMAGE -->
            <div class="product-details-image">
                <img id="detailImg" src="images/bracelet.jpg" alt="Handmade Product" class="product-detail-img">
            </div>

            <!-- PRODUCT CONTENT & ACTIONS -->
            <div class="product-details-content">
                <h2 id="detailTitle" style="text-align: left; margin-bottom: 10px; color: var(--dark-brown);">Handmade Bracelet</h2>
                <p class="product-detail-price" id="detailPrice" style="font-size: 24px; font-weight: bold; color: var(--dark-brown); margin-bottom: 15px;">₹250</p>
                <p class="product-detail-description" id="detailDesc" style="margin-bottom: 20px; line-height: 1.7;">
                    Beautiful handcrafted bracelet perfect for daily wear and gifting.
                </p>
                
                <div class="product-info" style="margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
                    <p style="margin-bottom: 6px;"><strong>Category:</strong> <span id="detailCategory">Accessories</span></p>
                    <p style="margin: 0;"><strong>Availability:</strong> <span style="color: green; font-weight: bold;">In Stock (Artisan Made)</span></p>
                </div>

                <div class="quantity-section" style="margin-bottom: 25px; display: flex; align-items: center; gap: 12px;">
                    <label for="detailQuantity" style="font-weight: bold;">Quantity:</label>
                    <input
                        type="number"
                        id="detailQuantity"
                        value="1"
                        min="1"
                        max="10"
                        style="width: 70px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 16px;">
                </div>

                <div class="product-actions" style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button type="button" class="btn" onclick="addCurrentProductToCart(false)">
                        Add to Cart 🛒
                    </button>
                    <button type="button" class="btn" onclick="addCurrentProductToCart(true)" style="background: var(--dark-brown); color: #fff;">
                        Buy Now ⚡
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 CraftVerse. All Rights Reserved.</p>
</footer>

<!-- Toast Notification -->
<div id="toast-notification" class="toast-notification"></div>

<script src="js/main.js"></script>
<script>
    // Handmade Product Catalog
    const catalog = {
        "1": { name: "Handmade Bracelet", price: 250, image: "images/bracelet.jpg", category: "Accessories", desc: "Beautiful handcrafted bracelet crafted with natural beads and eco-friendly thread, perfect for daily wear and gifting." },
        "2": { name: "Clay Pot", price: 400, image: "images/claypot.jpg", category: "Home Decor", desc: "Classic handmade terracotta clay pot ideal for indoor plants, table decoration, and organic home aesthetic." },
        "3": { name: "Wooden Photo Frame", price: 550, image: "images/frame.jpg", category: "Home Decor", desc: "Premium wooden frame intricately hand-carved by seasoned artisans to preserve your cherished memories forever." },
        "4": { name: "Decorative Flower Vase", price: 350, image: "images/vase.jpg", category: "Home Decor", desc: "Elegant handmade ceramic vase that adds a serene aesthetic and artistic touch to any corner of your room." },
        "5": { name: "Macrame Wall Hanging", price: 650, image: "images/macrame.jpg", category: "Home Decor", desc: "100% Cotton handmade macrame wall hanging crafted with intricate bohemian knot patterns." },
        "6": { name: "Handmade Bag", price: 750, image: "images/bag.jpg", category: "Accessories", desc: "Eco-friendly, highly durable jute & cotton tote bag designed for sustainable and stylish everyday shopping." },
        "7": { name: "Scented Candle", price: 450, image: "images/candle.jpg", category: "Living & Dining", desc: "Organic soy wax scented candle with soothing aromatic essential oils for aromatherapy and cozy evenings." },
        "8": { name: "Wooden Bowl", price: 300, image: "images/bowl.jpg", category: "Living & Dining", desc: "Hand-carved solid Sheesham wood bowl finished with food-safe natural polish for fruits and snacks." }
    };

    // Parse URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id") || "1";
    const currentProduct = catalog[productId] || catalog["1"];

    // Render Data into DOM
    document.getElementById("detailImg").src = currentProduct.image;
    document.getElementById("detailImg").alt = currentProduct.name;
    document.getElementById("detailTitle").textContent = currentProduct.name;
    document.getElementById("detailPrice").textContent = `₹${currentProduct.price}`;
    document.getElementById("detailDesc").textContent = currentProduct.desc;
    document.getElementById("detailCategory").textContent = currentProduct.category;

    // Add to Cart handler
    function addCurrentProductToCart(isBuyNow) {
        const qty = parseInt(document.getElementById("detailQuantity").value) || 1;
        let cart = getCart();
        const existingIndex = cart.findIndex(item => item.id === productId);

        if (existingIndex > -1) {
            cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + qty;
        } else {
            cart.push({
                id: productId,
                name: currentProduct.name,
                price: currentProduct.price,
                image: currentProduct.image,
                quantity: qty
            });
        }

        saveCart(cart);

        if (isBuyNow) {
            window.location.href = "checkout.html";
        } else {
            showToast(`Added ${qty} × "${currentProduct.name}" to cart! 🛒`);
        }
    }
</script>
</body>
</html>
