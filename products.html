<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ================= HEADER ================= -->
    <header>
        <h1>CraftVerse</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Products</a>
            <a href="cart.html">Cart <span class="cart-count-badge" style="display:none;">0</span></a>
            <a href="contact.html">Contact</a>
            <span id="nav-auth-links">
                <a href="login.html">Login</a>
            </span>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main>
        <section class="products-section">
            <h2>Our Handmade Products</h2>
            <p class="section-intro">
                Explore our collection of beautiful handmade products,
                carefully created by talented artisans.
            </p>

            <!-- Search Bar & Category Filters -->
            <div class="filter-controls"
                style="display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
                <input type="text" id="productSearchInput" placeholder="🔍 Search crafts..." onkeyup="filterProducts()"
                    style="padding: 10px 16px; border: 1px solid var(--border); border-radius: 25px; min-width: 260px; outline: none; background: #fff;">

                <div class="category-pills" style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button type="button" class="btn filter-btn active-filter"
                        onclick="filterCategory('all', this)">All</button>
                    <button type="button" class="btn filter-btn"
                        onclick="filterCategory('Accessories', this)">Accessories</button>
                    <button type="button" class="btn filter-btn" onclick="filterCategory('Decor', this)">Home
                        Decor</button>
                    <button type="button" class="btn filter-btn" onclick="filterCategory('Living', this)">Living &
                        Dining</button>
                </div>
            </div>

            <div class="product-container" id="products-grid">
                <p style="text-align: center; width: 100%; color: var(--muted); padding: 40px;">
                    ⏳ Loading authentic handmade crafts from database...
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 CraftVerse. All Rights Reserved.</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-notification" class="toast-notification"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        let allProducts = [];
        let currentCategory = 'all';

        // 1. MySQL Database se products fetch karna
        async function fetchProductsFromDB() {
            const grid = document.getElementById("products-grid");

            try {
                const response = await fetch("http://localhost:3000/api/products");
                const data = await response.json();

                if (data.success && data.products && data.products.length > 0) {
                    allProducts = data.products;
                    renderProducts(allProducts);
                } else {
                    grid.innerHTML = `<p style="text-align: center; width: 100%; color: var(--muted);">No products found in the database.</p>`;
                }
            } catch (error) {
                console.error("Database fetch error:", error);
                grid.innerHTML = `
                <p style="text-align: center; width: 100%; color: #a33; padding: 30px;">
                    ❌ Unable to connect to server. Please make sure Node.js server and MySQL are running!
                </p>
            `;
            }
        }

        // 2. Products ko HTML Grid me display karna
        function renderProducts(productsToDisplay) {
            const grid = document.getElementById("products-grid");

            if (productsToDisplay.length === 0) {
                grid.innerHTML = `<p style="text-align: center; width: 100%; color: var(--muted); padding: 40px;">No products match your search or filter.</p>`;
                return;
            }

            grid.innerHTML = productsToDisplay.map(prod => `
            <div class="product" data-name="${prod.name}" data-category="${prod.category}">
                <a href="product-details.html?id=${prod.product_id}" style="text-decoration: none; color: inherit;">
                    <img src="${prod.image || 'images/bracelet.jpg'}" class="product-img" alt="${prod.name}">
                </a>
                <div class="product-content">
                    <a href="product-details.html?id=${prod.product_id}" style="text-decoration: none; color: inherit;">
                        <h3>${prod.name}</h3>
                    </a>
                    <p class="product-description">
                        ${prod.description || 'Authentic handmade artisanal craft.'}
                    </p>
                    <p class="product-price">
                        <strong>₹${Number(prod.price)}</strong>
                    </p>
                    <button type="button" class="btn" onclick="addToCart({id: '${prod.product_id}', name: '${prod.name}', price: ${prod.price}, image: '${prod.image}'})">
                        Add to Cart
                    </button>
                </div>
            </div>
        `).join("");
        }

        // 3. Real-time Search Filter
        function filterProducts() {
            const searchVal = document.getElementById("productSearchInput").value.toLowerCase().trim();

            const filtered = allProducts.filter(prod => {
                const matchesSearch = prod.name.toLowerCase().includes(searchVal) ||
                    (prod.description && prod.description.toLowerCase().includes(searchVal));
                const matchesCategory = currentCategory === 'all' || prod.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            renderProducts(filtered);
        }

        // 4. Category Filter Buttons
        function filterCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active-filter"));
            if (btnElement) btnElement.classList.add("active-filter");
            filterProducts();
        }

        // Page load hone par database se fetch karein
        document.addEventListener("DOMContentLoaded", () => {
            fetchProductsFromDB();
        });
    </script>
</body>

</html>
