<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | CraftVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ================= HEADER ================= -->
    <header>
        <h1>CraftVerse</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Products</a>
            <a href="cart.html">Cart <span class="cart-count-badge" style="display:none;">0</span></a>
            <a href="contact.html">Contact</a>
            <span id="nav-auth-links">
                <a href="login.html">Login</a>
            </span>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main>
        <section class="products-section">
            <h2>Our Handmade Products</h2>
            <p class="section-intro">
                Explore our collection of beautiful handmade products,
                carefully created by talented artisans.
            </p>

            <!-- Search Bar & Category Filters -->
            <div class="filter-controls"
                style="display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
                <input type="text" id="productSearchInput" placeholder="🔍 Search crafts..." onkeyup="filterProducts()"
                    style="padding: 10px 16px; border: 1px solid var(--border); border-radius: 25px; min-width: 260px; outline: none; background: #fff;">

                <div class="category-pills" style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button type="button" class="btn filter-btn active-filter"
                        onclick="filterCategory('all', this)">All</button>
                    <button type="button" class="btn filter-btn"
                        onclick="filterCategory('Accessories', this)">Accessories</button>
                    <button type="button" class="btn filter-btn" onclick="filterCategory('Decor', this)">Home
                        Decor</button>
                    <button type="button" class="btn filter-btn" onclick="filterCategory('Living', this)">Living &
                        Dining</button>
                </div>
            </div>

            <div class="product-container" id="products-grid">
                <p style="text-align: center; width: 100%; color: var(--muted); padding: 40px;">
                    ⏳ Loading authentic handmade crafts from database...
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 CraftVerse. All Rights Reserved.</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-notification" class="toast-notification"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        let allProducts = [];
        let currentCategory = 'all';

        // 1. MySQL Database se products fetch karna
        async function fetchProductsFromDB() {
            const grid = document.getElementById("products-grid");

            try {
                const response = await fetch("/api/products");
                const data = await response.json();

                if (!response.ok || !data.success || !Array.isArray(data.products)) {
                    grid.innerHTML = `<p style="text-align: center; width: 100%; color: #a33; padding: 30px;">Unable to load products because of a server or database error. Please try again later.</p>`;
                    return;
                }

                allProducts = data.products;
                if (allProducts.length === 0) {
                    grid.innerHTML = `<p style="text-align: center; width: 100%; color: var(--muted);">No products found in the database.</p>`;
                    return;
                }

                renderProducts(allProducts);
            } catch (error) {
                console.error("Database fetch error:", error);
                grid.innerHTML = `
                <p style="text-align: center; width: 100%; color: #a33; padding: 30px;">
                    ❌ Unable to connect to server. Please make sure Node.js server and MySQL are running!
                </p>
            `;
            }
        }

        // 2. Products ko HTML Grid me display karna
        function renderProducts(productsToDisplay) {
            const grid = document.getElementById("products-grid");

            if (productsToDisplay.length === 0) {
                grid.innerHTML = `<p style="text-align: center; width: 100%; color: var(--muted); padding: 40px;">No products match your search or filter.</p>`;
                return;
            }

            grid.replaceChildren();
            productsToDisplay.forEach(prod => {
                const productCard = document.createElement("div");
                productCard.className = "product";
                productCard.dataset.name = prod.name || "";
                productCard.dataset.category = prod.category || "";

                const productLink = document.createElement("a");
                productLink.href = `product-details.html?id=${encodeURIComponent(prod.product_id)}`;
                productLink.style.textDecoration = "none";
                productLink.style.color = "inherit";

                const image = document.createElement("img");
                image.src = prod.image || "images/bracelet.jpg";
                image.className = "product-img";
                image.alt = prod.name || "Handmade product";
                productLink.append(image);

                const content = document.createElement("div");
                content.className = "product-content";

                const nameLink = document.createElement("a");
                nameLink.href = productLink.href;
                nameLink.style.textDecoration = "none";
                nameLink.style.color = "inherit";
                const name = document.createElement("h3");
                name.textContent = prod.name || "Unnamed product";
                nameLink.append(name);

                const description = document.createElement("p");
                description.className = "product-description";
                description.textContent = prod.description || "Authentic handmade artisanal craft.";

                const price = document.createElement("p");
                price.className = "product-price";
                const priceValue = document.createElement("strong");
                priceValue.textContent = `₹${Number(prod.price)}`;
                price.append(priceValue);

                const addButton = document.createElement("button");
                addButton.type = "button";
                addButton.className = "btn";
                addButton.textContent = "Add to Cart";
                addButton.addEventListener("click", () => addToCart({
                    id: String(prod.product_id),
                    name: prod.name,
                    price: Number(prod.price),
                    image: prod.image || "images/bracelet.jpg"
                }));

                content.append(nameLink, description, price, addButton);
                productCard.append(productLink, content);
                grid.append(productCard);
            });
        }

        // 3. Real-time Search Filter
        function filterProducts() {
            const searchVal = document.getElementById("productSearchInput").value.toLowerCase().trim();

            const filtered = allProducts.filter(prod => {
                const matchesSearch = prod.name.toLowerCase().includes(searchVal) ||
                    (prod.description && prod.description.toLowerCase().includes(searchVal));
                const matchesCategory = currentCategory === 'all' || prod.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            renderProducts(filtered);
        }

        // 4. Category Filter Buttons
        function filterCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active-filter"));
            if (btnElement) btnElement.classList.add("active-filter");
            filterProducts();
        }

        // Page load hone par database se fetch karein
        document.addEventListener("DOMContentLoaded", () => {
            fetchProductsFromDB();
        });
    </script>
</body>

</html>
